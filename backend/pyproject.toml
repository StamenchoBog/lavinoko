[project]
name = "lavinoko"
version = "0.1.0"
description = "Avalanche information proof of concept for North Macedonia"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pillow>=10.0",
    "pmtiles>=3.4",
    "pydantic>=2.9",
    "rasterio>=1.3",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv]
package = false

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["F", "E", "W", "B", "UP", "SIM", "I"]
ignore = ["E501", "E731"]

name: CI

# Checks only: lint, tests, type check and build. Nothing is deployed and no data is fetched.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Lint
        run: |
          uvx ruff check .
          uvx ruff format --check .
      - name: Tests
        run: uv run --group dev pytest -q
      # The frontend's types and data check are generated from backend/contract/models.py.
      - name: Data contract up to date
        run: uv run python -m contract.generate --check

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check (warnings fail too)
        run: npm run check
      - name: Build
        run: npm run build
      - name: First page load under 100 KB
        run: npm run size
      # static/data/ is generated and not in git: the tests use the small copy in tests/fixtures/data.
      - name: Test data
        run: npm run test:data
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Playwright tests
        run: npm test
      - name: Keep traces of failed tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: frontend/test-results/
          retention-days: 7
